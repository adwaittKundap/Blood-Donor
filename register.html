<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LifeFlow</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet"
        href="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
</head>

<body class="auth-page">
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <i class="fas fa-heartbeat"></i>
                <span>LifeFlow</span>
            </a>
            <button class="nav-toggle" id="navToggle">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="dashboard.html" class="nav-link">Find Donors</a></li>
                <li><a href="register.html" class="nav-link active">Register</a></li>
                <li><a href="login.html" class="nav-link btn-nav">Login</a></li>
            </ul>
        </div>
    </nav>

    <!-- Registration Form -->
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1>Create Account</h1>
                <p>Join our community of life savers</p>
            </div>

            <form id="registerForm" class="auth-form">
                <!-- Personal Information -->
                <div class="form-section">
                    <h3><i class="fas fa-user"></i> Personal Information</h3>

                    <div class="form-group">
                        <label for="fullName">Full Name *</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name"
                                minlength="3">
                        </div>
                        <span class="error-message" id="fullNameError"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="age">Age *</label>
                            <div class="input-wrapper">
                                <i class="fas fa-calendar"></i>
                                <input type="number" id="age" name="age" required placeholder="Age" min="18" max="65">
                            </div>
                            <span class="error-message" id="ageError"></span>
                        </div>

                        <div class="form-group">
                            <label for="gender">Gender *</label>
                            <div class="input-wrapper">
                                <i class="fas fa-venus-mars"></i>
                                <select id="gender" name="gender" required>
                                    <option value="">Select Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <span class="error-message" id="genderError"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="bloodGroup">Blood Group *</label>
                        <div class="input-wrapper">
                            <i class="fas fa-tint"></i>
                            <select id="bloodGroup" name="bloodGroup" required>
                                <option value="">Select Blood Group</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>
                        <span class="error-message" id="bloodGroupError"></span>
                    </div>
                </div>

                <!-- Contact Information -->
                <div class="form-section">
                    <h3><i class="fas fa-address-book"></i> Contact Information</h3>

                    <div class="form-group">
                        <label for="phone">Contact Number *</label>
                        <div class="input-wrapper">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number"
                                pattern="[0-9]{10,15}">
                        </div>
                        <span class="error-message" id="phoneError"></span>
                    </div>

                    <div class="form-group">
                        <label for="location">Location/City *</label>
                        <div class="input-wrapper">
                            <i class="fas fa-map-marker-alt"></i>
                            <input type="text" id="location" name="location" required placeholder="Enter your city">
                        </div>
                        <span class="error-message" id="locationError"></span>
                    </div>

                    <div class="form-group">
                        <label for="address">Full Address</label>
                        <div class="input-wrapper textarea-wrapper">
                            <i class="fas fa-home"></i>
                            <textarea id="address" name="address" rows="2"
                                placeholder="Enter your full address (optional)"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Account Information -->
                <div class="form-section">
                    <h3><i class="fas fa-lock"></i> Account Information</h3>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" required placeholder="Enter your email">
                        </div>
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password *</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" required
                                placeholder="Create a password" minlength="6">
                            <button type="button" class="toggle-password" onclick="togglePassword('password')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span class="password-strength" id="passwordStrength"></span>
                        <span class="error-message" id="passwordError"></span>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password *</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirmPassword" name="confirmPassword" required
                                placeholder="Confirm your password">
                            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-message" id="confirmPasswordError"></span>
                    </div>
                </div>

                <!-- Donor Status -->
                <div class="form-section">
                    <h3><i class="fas fa-heart"></i> Donor Status</h3>
                    <p class="section-description">Select your current donation availability</p>

                    <div class="status-options">
                        <label class="status-option live">
                            <input type="radio" name="status" value="live" required>
                            <span class="status-card">
                                <span class="status-icon"><i class="fas fa-check-circle"></i></span>
                                <span class="status-title">Live Donor</span>
                                <span class="status-desc">Available to donate now</span>
                            </span>
                        </label>

                        <label class="status-option donated">
                            <input type="radio" name="status" value="donated">
                            <span class="status-card">
                                <span class="status-icon"><i class="fas fa-clock"></i></span>
                                <span class="status-title">Recently Donated</span>
                                <span class="status-desc">Donated within last 3 months</span>
                            </span>
                        </label>

                        <label class="status-option not-willing">
                            <input type="radio" name="status" value="not-willing">
                            <span class="status-card">
                                <span class="status-icon"><i class="fas fa-times-circle"></i></span>
                                <span class="status-title">Not Available</span>
                                <span class="status-desc">Currently not willing to donate</span>
                            </span>
                        </label>
                    </div>
                    <span class="error-message" id="statusError"></span>
                </div>

                <!-- Terms & Submit -->
                <div class="form-section">
                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms" required>
                            <span class="checkmark"></span>
                            I agree to the <a href="#" class="link">Terms of Service</a> and
                            <a href="#" class="link">Privacy Policy</a>
                        </label>
                        <span class="error-message" id="termsError"></span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </div>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html" class="link">Login here</a></p>
                </div>
            </form>
        </div>
    </main>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="toast-icon"></i>
        <span class="toast-message"></span>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
